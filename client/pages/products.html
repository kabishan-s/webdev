<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Luxurious+Roman&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Luxurious+Roman&family=Pinyon+Script&display=swap" rel="stylesheet">

    <title>Products</title>

     
    <link rel="stylesheet" href="../css/products.css" />

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    
    <script src="../js/products.js" defer></script>
    
  </head>

  <body>
    <div class="container">
        <div class="navbar">
          <div class="logo">
            <a href="homepage.html">
              <img src="../logo/logo.png">
            </a>
          </div>
          <nav>
            <ul>
              <li>
                <a href="homepage.html">Home</a>
              </li>
              <li>
                <a href="products.html">Products</a>
              </li>
              <li>
                <a href="">Contact</a>
              </li>
              <li>
                <a href="">Account</a>
              </li>
              <li>
                <a href="cart.html">Cart</a>
              </li>
            </ul>
          </nav>
      </div>
    </div>

    <h1 class="products-title">Products</h1>

    <p id="filter" class="filter"></p>

    <div class="filter-container">
      <div class="filters">
        <h3>Filter Products</h3>
        <div class="filter-group">
          <div class="filter-title">Gender</div>
          <div class="filter-options">
            <div data-filter="gender" data-choice="">All</div>
            <div data-filter="gender" data-choice="mens">Men</div>
            <div data-filter="gender" data-choice="womens">Women</div>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-title">Garment</div>
          <div class="filter-options">
            <div data-filter="category" data-choice="">All</div>
            <div data-filter="category" data-choice="shirts">Shirt</div>
            <div data-filter="category" data-choice="jackets">Jacket</div>
            <div data-filter="category" data-choice="pants">Pants</div>
            <div data-filter="category" data-choice="shoes">Shoes</div>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-title">Price</div>
          <div class="filter-options">
            <div data-filter="price" data-choice="">All</div>
            <div data-filter="price" data-choice="0-150">$0 - $150</div>
            <div data-filter="price" data-choice="150-200">$150 - $200</div>
            <div data-filter="price" data-choice="200-300">$200 - $300</div>
            <div data-filter="price" data-choice="300+">300+</div>
          </div>
        </div>
        
        <button id="apply">Apply</button>

      </div>
        <div id="products-list" class="products-list"></div>
    </div>
  </body>
</html>
