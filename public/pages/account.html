<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Luxurious+Roman&family=Pinyon+Script&display=swap"
      rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Luxurious+Roman&family=Pinyon+Script&display=swap"
      rel="stylesheet">

    <title>Account</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/account.css" />

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

  </head>

  <body>
    <nav class="navbar is-light" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="homepage.html">
          <img src="../logo/logo.png" alt="Logo">
        </a>
        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbar">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <div id="navbar" class="navbar-menu">
        <div class="navbar-end">
          <a class="navbar-item" href="homepage.html">
            Home
          </a>
          <div class="navbar-item has-dropdown is-hoverable">
            <a class="navbar-link" href="products.html">
              Products
            </a>
            <div class="navbar-dropdown">
              <p class="navbar-item navbar-section">Men</p>
              <a class="navbar-item dropdown-item" href="products.html?gender=mens&category=shirts">Shirts</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=mens&category=jackets">Jackets</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=mens&category=pants">Pants</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=mens&category=shoes">Shoes</a>
              <hr class="navbar-divider">
              <p class="navbar-item navbar-section">Women</p>
              <a class="navbar-item dropdown-item" href="products.html?gender=womens&category=shirts">Shirts</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=womens&category=jackets">Jackets</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=womens&category=pants">Pants</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=womens&category=shoes">Shoes</a>
            </div>
          </div>
          <a class="navbar-item" href="account.html">
            Account
          </a>
          <a class="navbar-item" href="cart.html">
            Cart
          </a>
        </div>
      </div>
    </nav>
    <div class="account-container">
      <div class="account">

        <h1 class="account-title">Account</h1>

        <div class="section" id="authentication">
          <h2 id="form-title">Sign-In</h2>

          <div class="field">
            <label>Email</label>
            <input type="text" id="email">
            <span class="field-error" id="email-error"></span>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="password">
            <span class="field-error" id="password-error"></span>
          </div>

          <button class="signin-button" id="signin-button">Sign-In</button>

          <p style="margin-top:10px;">
            <a href="#" id="toggle-form">Don't have an account? Create Account</a>
          </p>
        </div>

        <div id="account-overview" style="display:none;">
        <div class="overview">
          <div class="orders">
            <h2 id="section-title">Orders</h2>
            <div class="order-tabs" id="order-tabs" style="display:none;">
              <button id="orders-tab" class="active">Orders</button>
              <button id="all-orders-tab">All Orders</button>
              <button id="sales-trend-tab">Sales Trend</button>
              <button id="product-sales-tab">Product Sales</button>
              <button id="gender-sales-tab">Gender Sales</button>
            </div>
            <div id="orders"></div>
            <svg id="trend-chart" style="display:none;"></svg>
            <svg id="product-chart" style="display:none;"></svg>
            <svg id="gender-chart" style="display:none;"></svg>
          </div>

          <div class="account-info">
            <h3>Account Info</h3>
            <p id="user-email"></p>
            <button id="signout-button">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  <script src="../js/account.js"></script>
  </body>
</html>
