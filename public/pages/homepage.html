<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Luxurious+Roman&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Luxurious+Roman&family=Pinyon+Script&display=swap" rel="stylesheet">

    <title>Clothing Store</title>

    <link rel="stylesheet" href="../css/homepage.css" />

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    
  </head>

  <body>
    <div class="container">
        <div class="navbar">
          <div class="logo">
            <a href="homepage.html">
              <img src="../logo/logo.png">
            </a>
          </div>
          <nav>
            <ul>
              <li>
                <a href="homepage.html">Home</a>
              </li>
              <li>
                <a href="products.html">Products</a>
              </li>
              <li>
                <a href="">Contact</a>
              </li>
              <li>
                <a href="account.html">Account</a>
              </li>
              <li>
                <a href="cart.html">Cart</a>
              </li>
            </ul>
          </nav>
      </div>
    </div>
    <div class="home">
      <div class="title">
        <h1>LUXURY APPAREL</h1>
        <p>clothing made for luxury</p>
        <a href="products.html" class="button">Start Shopping</a>
      </div>
      <div class="hero">
        <img src="../logo/logo.png">
      </div>
    </div>

    <!-- Catalog -->
    <div class="category-banner">
      <img src="../photos/menbanner.png">
      <div class="banner-caption">
        <h2>MEN'S COLLECTION</h2>
      </div>
    </div>
    <div class="apparel">
      <h2 class="section">Shop For Men</h2>
      <div class="mens">
        <a href="products.html?gender=mens&category=shirts" class="category">
          <img src="../photos/menshirt.png">
          <p class="category-name">Shirts</p>
        </a>
        <a href="products.html?gender=mens&category=jackets" class="category">
          <img src="../photos/menjacket.png">
          <p class="category-name">Jackets</p>
        </a>
        <a href="products.html?gender=mens&category=pants" class="category">
          <img src="../photos/menpants.png">
          <p class="category-name">Pants</p>
        </a>
        <a href="products.html?gender=mens&category=shoes" class="category">
          <img src="../photos/menshoes.png">
          <p class="category-name">Shoes</p>
        </a>
      </div>
    </div>

    <div class="category-banner">
      <img src="../photos/womenbanner.png">
      <div class="banner-caption">
        <h2>WOMEN'S COLLECTION</h2>
      </div>
    </div>
    <div class="apparel">
      <h2 class="section">Shop For Women</h2>
      <div class="mens">
        <a href="products.html?gender=womens&category=shirts" class="category">
          <img src="../photos/womenshirt.png">
          <p class="category-name">Shirts</p>
        </a>
        <a href="products.html?gender=womens&category=jackets" class="category">
          <img src="../photos/womenjacket.png">
          <p class="category-name">Jackets</p>
        </a>
        <a href="products.html?gender=womens&category=pants" class="category">
          <img src="../photos/womenpants.png">
          <p class="category-name">Pants</p>
        </a>
        <a href="products.html?gender=womens&category=shoes" class="category">
          <img src="../photos/womenshoes.png">
          <p class="category-name">Shoes</p>
        </a>
      </div>
    </div>

  </body>
</html>
