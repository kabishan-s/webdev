<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Luxurious+Roman&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Luxurious+Roman&family=Pinyon+Script&display=swap" rel="stylesheet">

    <title>Checkout</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/checkout.css" />
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="../js/checkout.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  </head>

  <body>
    <nav class="navbar is-light" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="homepage.html">
          <img src="../logo/logo.png" alt="Logo">
        </a>
        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbar">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <div id="navbar" class="navbar-menu">
        <div class="navbar-end">
          <a class="navbar-item" href="homepage.html">
            Home
          </a>
          <div class="navbar-item has-dropdown is-hoverable">
            <a class="navbar-link" href="products.html">
              Products
            </a>
            <div class="navbar-dropdown">
              <p class="navbar-item navbar-section">Men</p>
              <a class="navbar-item dropdown-item" href="products.html?gender=mens&category=shirts">Shirts</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=mens&category=jackets">Jackets</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=mens&category=pants">Pants</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=mens&category=shoes">Shoes</a>
              <hr class="navbar-divider">
              <p class="navbar-item navbar-section">Women</p>
              <a class="navbar-item dropdown-item" href="products.html?gender=womens&category=shirts">Shirts</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=womens&category=jackets">Jackets</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=womens&category=pants">Pants</a>
              <a class="navbar-item dropdown-item" href="products.html?gender=womens&category=shoes">Shoes</a>
            </div>
          </div>
          <a class="navbar-item" href="account.html">
            Account
          </a>
          <a class="navbar-item" href="cart.html">
            Cart
          </a>
        </div>
      </div>
    </nav>

    <div class="checkout-wrapper">

      <div class="checkout-left">
        <h1 class="checkout-title">Checkout</h1>

        <div class="section-block">
          <h2>Contact</h2>
          <div class="field">
            <label>Email Address</label>
            <input type="text" id="email" placeholder="john@example.com">
            <span class="field-error" id="error-email"></span>
          </div>
        </div>

        <div class="section-block">
          <h2>Payment</h2>
          <div class="field">
            <label>Cardholder Name</label>
            <input type="text" id="card-name" placeholder="John Smith" maxlength="60">
            <span class="field-error" id="error-name"></span>
          </div>
          <div class="field">
            <label>Card Number</label>
            <input type="text" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19">
            <span class="field-error" id="error-number"></span>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Expiry Date</label>
              <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5">
              <span class="field-error" id="error-expiry"></span>
            </div>
            <div class="field">
              <label>CVV</label>
              <input type="text" id="card-cvv" placeholder="123" maxlength="3">
              <span class="field-error" id="error-cvv"></span>
            </div>
          </div>
        </div>

        <button class="pay-btn" id="pay-btn">Complete Transaction</button>
      </div>

      <div class="checkout-right">
        <h2>Order Summary</h2>
        <div id="order-items"></div>
        <div class="order-totals">
          <p>Subtotal: $<span id="subtotal">0.00</span></p>
          <p>Tax (13%): $<span id="tax">0.00</span></p>
          <p class="order-total">Total: $<span id="total">0.00</span></p>
        </div>
      </div>

    </div>

  </body>
</html>
